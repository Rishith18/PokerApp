<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker - Heads-Up Texas Hold'em</title>
    <link rel="stylesheet" href="css/poker.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="game-header">
            <h1>Heads-Up Texas Hold'em</h1>
            <div class="win-counter">
                <span class="bot-wins">Bot: <strong id="bot-wins">0</strong></span>
                <span class="player-wins">You: <strong id="player-wins">0</strong></span>
            </div>
        </header>

        <!-- Main game area -->
        <div class="game-container">
            <!-- Bot section (top) -->
            <div class="player-area bot-area">
                <div class="player-info">
                    <div class="player-name">Bot</div>
                    <div class="player-stack">
                        <span class="chip-icon">💰</span>
                        <span id="bot-stack">100.00</span>
                    </div>
                </div>
                <div class="player-cards" id="bot-cards">
                    <div class="card card-back"></div>
                    <div class="card card-back"></div>
                </div>
                <div class="player-action" id="bot-action"></div>
            </div>

            <!-- Poker table -->
            <div class="poker-table">
                <div class="table-felt">
                    <!-- Community cards -->
                    <div class="community-cards" id="community-cards">
                        <div class="card card-placeholder"></div>
                        <div class="card card-placeholder"></div>
                        <div class="card card-placeholder"></div>
                        <div class="card card-placeholder"></div>
                        <div class="card card-placeholder"></div>
                    </div>

                    <!-- Pot display -->
                    <div class="pot-display">
                        <div class="pot-label">POT</div>
                        <div class="pot-amount">
                            <span class="chip-icon">💰</span>
                            <span id="pot-amount">0.00</span>
                        </div>
                    </div>

                    <!-- Round indicator -->
                    <div class="round-indicator" id="round-indicator">
                        Preflop
                    </div>
                </div>
            </div>

            <!-- Player section (bottom) -->
            <div class="player-area human-area">
                <div class="player-action" id="player-action"></div>
                <div class="player-cards" id="player-cards">
                    <div class="card card-back"></div>
                    <div class="card card-back"></div>
                </div>
                <div class="player-info">
                    <div class="player-name">You</div>
                    <div class="player-stack">
                        <span class="chip-icon">💰</span>
                        <span id="player-stack">100.00</span>
                    </div>
                </div>
            </div>

            <!-- Action buttons -->
            <div class="action-panel" id="action-panel">
                <button class="action-btn fold-btn" id="fold-btn">Fold</button>
                <button class="action-btn call-btn" id="call-btn">Check</button>
                <div class="raise-controls" id="raise-controls">
                    <div class="raise-presets">
                        <button class="preset-btn" data-multiplier="0.5">½ Pot</button>
                        <button class="preset-btn" data-multiplier="0.75">¾ Pot</button>
                        <button class="preset-btn" data-multiplier="1.0">Pot</button>
                        <button class="preset-btn" data-multiplier="allin">All-In</button>
                    </div>
                    <div class="raise-custom">
                        <input type="number" id="raise-amount" placeholder="Amount" step="0.1" min="0">
                        <button class="action-btn raise-btn" id="raise-btn">Raise</button>
                    </div>
                </div>
            </div>

            <!-- New hand button -->
            <div class="control-panel">
                <button class="new-hand-btn" id="new-hand-btn">New Hand</button>
            </div>
        </div>

        <!-- Winner modal -->
        <div class="modal" id="winner-modal">
            <div class="modal-content">
                <h2 id="winner-title">Hand Complete</h2>
                <p id="winner-message"></p>
                <button class="modal-btn" id="next-hand-btn">Next Hand</button>
            </div>
        </div>

        <!-- Loading indicator -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Processing...</p>
        </div>

        <!-- Side panel for hand history (optional) -->
        <aside class="side-panel">
            <h3>Game Info</h3>
            <div class="game-stats">
                <div class="stat-item">
                    <span class="stat-label">Hands Played:</span>
                    <span class="stat-value" id="hands-played">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Current Round:</span>
                    <span class="stat-value" id="current-round">-</span>
                </div>
            </div>
            <div class="hand-history">
                <h4>Last Action</h4>
                <div id="last-action-log">-</div>
            </div>
        </aside>
    </div>

    <!-- JavaScript -->
    <script src="js/ui.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
